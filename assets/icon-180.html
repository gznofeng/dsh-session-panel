<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  /* Two stages: 180px is the storefront asset we ship, and its downscale is
     what the market actually draws at ~96px. Shot separately so each capture
     is exactly one tile. */
  .stage { display: flex; align-items: center; justify-content: center; background: transparent; }
  #s180 { width: 180px; height: 180px; }
  .tile {
    width: 180px; height: 180px; border-radius: 40px;
    background: linear-gradient(160deg, #ffffff 0%, #eef4fd 55%, #dce9fa 100%);
    box-shadow: inset 0 0 0 2px rgba(47, 111, 208, 0.26);
    display: flex; align-items: center; justify-content: center;
  }
  svg { display: block; }
</style>
</head>
<body>
  <!-- The market supplies the real tile chrome; this raster is the storefront
       card image, so it carries its own tile and stays square. -->
  <div class="stage" id="s180">
    <div class="tile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="128" height="128" role="img" aria-label="Session panel">
        <rect x="5" y="7.5" width="26" height="6.5" rx="2" fill="none" stroke="#2f6fd0" stroke-width="2.1"/>
        <rect x="5" y="17.5" width="11.5" height="13" rx="2" fill="none" stroke="#2f6fd0" stroke-width="2.1"/>
        <rect x="19.5" y="17.5" width="11.5" height="13" rx="2" fill="none" stroke="#2f6fd0" stroke-width="2.1"/>
        <circle cx="9" cy="10.75" r="1.5" fill="#2f6fd0"/>
        <circle cx="9" cy="21" r="1.5" fill="#2f6fd0" fill-opacity="0.5"/>
        <circle cx="23.5" cy="21" r="1.5" fill="#2f6fd0" fill-opacity="0.5"/>
      </svg>
    </div>
  </div>
</body>
</html>
